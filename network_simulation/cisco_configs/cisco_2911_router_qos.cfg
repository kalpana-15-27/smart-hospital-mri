! ==============================================================================
! CISCO 2911 LAYER 3 CORE ROUTER & QoS GATEWAY CONFIGURATION
! Project: Smart Hospital Emergency MRI Prioritization System
! Inter-VLAN Routing, MQC QoS Architecture (RFC 2474 / 3246), and LLQ/CBWFQ
! ==============================================================================

version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname HOSP-CORE-RTR-01
!
! ------------------------------------------------------------------------------
! 1. EXTENDED ACCESS LISTS FOR SECURITY & TRUST BOUNDARY (Section 15)
! ------------------------------------------------------------------------------
! Permit authorized DICOM traffic to PACS Server (TCP Port 104)
ip access-list extended ACL_DICOM_PACS
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq 104
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.30.10 eq 104
 permit tcp 192.168.30.0 0.0.0.255 host 192.168.30.10 eq 104
!
! Anti-Spoofing ACL: Block untrusted subnets from injecting DSCP EF / AF41
ip access-list extended ACL_BLOCK_DSCP_SPOOFING
 deny ip 192.168.40.0 0.0.0.255 any dscp ef
 deny ip 192.168.40.0 0.0.0.255 any dscp af41
 deny ip 192.168.99.0 0.0.0.255 any dscp ef
 deny ip 192.168.99.0 0.0.0.255 any dscp af41
 permit ip any any
!
! ------------------------------------------------------------------------------
! 2. MODULAR QoS CLI (MQC) - CLASS MAP DEFINITIONS (Section 7)
! ------------------------------------------------------------------------------
! Class 1: Emergency Traffic (Matches DSCP EF = 46, Binary 101110)
class-map match-any EMERGENCY_TRAFFIC
 description Class for Time-Critical Emergency Trauma and Stroke MRI Studies
 match ip dscp ef
 match ip precedence 5
!
! Class 2: Urgent ICU Traffic (Matches DSCP AF41 = 34, Binary 100010)
class-map match-any URGENT_TRAFFIC
 description Class for Urgent ICU and Inpatient Priority Imaging Studies
 match ip dscp af41
 match ip precedence 4
!
! Class 3: Routine Imaging (Matches Default / CS0 = 0, Binary 000000)
class-map match-any ROUTINE_TRAFFIC
 description Class for Scheduled Outpatient and Follow-up MRI Scans
 match ip dscp default
 match ip dscp cs0
!
! ------------------------------------------------------------------------------
! 3. MODULAR QoS CLI (MQC) - POLICY MAP DEFINITIONS (Section 8)
! ------------------------------------------------------------------------------
policy-map HOSPITAL_MRI_QOS_POLICY
 description Strict Priority Low-Latency Queuing (LLQ) and CBWFQ Scheduling
 
 ! 1. EMERGENCY CLASS: Dedicated Strict Priority Low Latency Queue (LLQ)
 ! Guarantees immediate packet forwarding bypassing congestion buffers
 class EMERGENCY_TRAFFIC
  priority percent 50
  
 ! 2. URGENT CLASS: Class-Based Weighted Fair Queue (CBWFQ)
 ! Guarantees minimum 30% of remaining link bandwidth during congestion
 class URGENT_TRAFFIC
  bandwidth percent 30
  queue-limit 64 packets
  
 ! 3. DEFAULT / ROUTINE CLASS: Fair-Queue with Starvation Prevention
 ! Allocates minimum 20% bandwidth, avoiding complete starvation of routine scans
 class class-default
  bandwidth percent 20
  fair-queue
  random-detect dscp-based
!
! ------------------------------------------------------------------------------
! 4. INTER-VLAN ROUTING & SUB-INTERFACE CONFIGURATIONS (Section 6)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/0
 description TRUNK_DOWNLINK_TO_ACCESS_SWITCH
 no ip address
 duplex auto
 speed auto
 no shutdown
!
! VLAN 10 Sub-Interface: Emergency & Trauma Department Gateway
interface GigabitEthernet0/0.10
 description GATEWAY_VLAN_10_EMERGENCY_TRAUMA
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
! VLAN 20 Sub-Interface: Routine Radiology Gateway
interface GigabitEthernet0/0.20
 description GATEWAY_VLAN_20_ROUTINE_RADIOLOGY
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 no shutdown
!
! VLAN 30 Sub-Interface: PACS Core & MRI Server Gateway
interface GigabitEthernet0/0.30
 description GATEWAY_VLAN_30_PACS_CORE_SERVERS
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 no shutdown
!
! VLAN 40 Sub-Interface: Hospital Administration Gateway
interface GigabitEthernet0/0.40
 description GATEWAY_VLAN_40_HOSPITAL_ADMIN
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 no shutdown
!
! ------------------------------------------------------------------------------
! 5. CORE WAN / PACS UPLINK WITH ATTACHED QoS SERVICE POLICY
! ------------------------------------------------------------------------------
interface GigabitEthernet0/1
 description CORE_PACS_UPLINK_BOTTLENECK_100MBPS
 ip address 192.168.30.254 255.255.255.0
 duplex full
 speed 100
 ! Apply the DiffServ QoS Policy to the egress interface queue
 service-policy output HOSPITAL_MRI_QOS_POLICY
 no shutdown
!
end
