! ==============================================================================
! CISCO CATALYST 2960 LAYER 2 ACCESS SWITCH CONFIGURATION
! Project: Smart Hospital Emergency MRI Prioritization System
! VLAN Segmentation & 802.1Q / 802.1p CoS Configuration
! ==============================================================================

version 15.0
no service timestamps log datetime msec
service password-encryption
!
hostname HOSP-ACC-SW-01
!
! ------------------------------------------------------------------------------
! 1. VLAN CREATION & SEGMENTATION (Section 6)
! ------------------------------------------------------------------------------
vlan 10
 name EMERGENCY_CLINICAL
!
vlan 20
 name ROUTINE_RADIOLOGY
!
vlan 30
 name PACS_MRI_SERVERS
!
vlan 40
 name HOSPITAL_ADMIN
!
vlan 99
 name GUEST_UNTRUSTED
!
! ------------------------------------------------------------------------------
! 2. QUALITY OF SERVICE (QoS) GLOBAL TRUST SETTINGS
! ------------------------------------------------------------------------------
! Enable hardware QoS processing on the Catalyst switch
mls qos
!
! Map 802.1p Class of Service (CoS) to IP DSCP values:
! CoS 5 (Voice/Emergency) -> DSCP 46 (EF)
! CoS 4 (Urgent/ICU)      -> DSCP 34 (AF41)
! CoS 0 (Best Effort)     -> DSCP 0  (CS0)
mls qos map cos-dscp 0 8 16 24 34 46 48 56
!
! ------------------------------------------------------------------------------
! 3. ACCESS PORT ALLOCATIONS
! ------------------------------------------------------------------------------
! FastEthernet 0/1: Emergency Trauma Resuscitation Workstation (192.168.10.10)
interface FastEthernet0/1
 description EMERGENCY_TRAUMA_WORKSTATION_01
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Trust DSCP markings received from authorized clinical terminal
 mls qos trust dscp
!
! FastEthernet 0/2: ICU Clinical Monitoring Node (192.168.10.15)
interface FastEthernet0/2
 description ICU_CLINICAL_CONSOLE_01
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 mls qos trust dscp
!
! FastEthernet 0/5: Routine Radiology Imaging Console (192.168.20.10)
interface FastEthernet0/5
 description ROUTINE_RADIOLOGY_CONSOLE_01
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 mls qos trust dscp
!
! FastEthernet 0/10: Hospital PACS Server Node (192.168.30.10)
interface FastEthernet0/10
 description CENTRAL_PACS_SERVER_TCP104
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 mls qos trust dscp
!
! FastEthernet 0/11: Siemens 3.0T MRI Modality Scanner (192.168.30.20)
interface FastEthernet0/11
 description SIEMENS_3T_MAGNETOM_SCANNER
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 mls qos trust dscp
!
! FastEthernet 0/20: Hospital Administration / Billing Desk (192.168.40.10)
! Untrusted port: force-remark any client-provided DSCP to CS0 (0)
interface FastEthernet0/20
 description ADMIN_BILLING_DESK_UNTRUSTED
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no mls qos trust
!
! ------------------------------------------------------------------------------
! 4. 802.1Q TRUNK UPLINK TO CISCO 2911 CORE L3 ROUTER
! ------------------------------------------------------------------------------
interface GigabitEthernet0/1
 description TRUNK_UPLINK_TO_CISCO_2911_ROUTER
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk allowed vlan 10,20,30,40,99
 mls qos trust dscp
!
end
